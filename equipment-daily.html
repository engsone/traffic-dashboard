<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجل الفحص اليومي للمعدات والآليات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--p:#407189;--brick:#A8483D;--taupe:#7B6756;--gray:#636569;--green:#3E7761;--gold:#C6A230;--g1:#9FC3B3;--line:#d9dde1;--bg:#F2F4F5;--beige:#E8E4D0}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:#1f2328}
.app{max-width:860px;margin:0 auto;padding:12px 12px 130px}
.top{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top img{height:40px}
.top h1{font-size:17px;margin:0;color:var(--green);text-align:center;flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;color:var(--green);margin:0 0 10px;border-bottom:2px solid var(--green);padding-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-size:12px;color:var(--gray);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
label.f{display:block;font-size:12px;color:var(--gray);margin-bottom:3px}
label.f b{color:var(--brick)}
input[type=text],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:14px;background:#fff}
input[readonly]{background:#f6f7f8;color:var(--gray)}
textarea{resize:vertical;min-height:40px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.item.done{border-right:4px solid var(--green)}
.item.bad{border-right:4px solid var(--brick)}
.item.miss{border-right:4px solid #e3b8b2;background:#fffafa}
.ih{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.ih img{width:44px;height:44px;object-fit:contain;flex:none}
.ih .t{font-weight:700;font-size:15px}
.ih .c{font-size:12px;color:var(--gray);line-height:1.5}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on.y{background:var(--green);color:#fff;border-color:var(--green)}
.seg button.on.n{background:var(--brick);color:#fff;border-color:var(--brick)}
.seg button.on.na{background:var(--gray);color:#fff;border-color:var(--gray)}
.mt{display:flex;align-items:center;gap:8px;margin:8px 2px 6px;font-size:13px;font-weight:600;color:#7a5a00}
.mt input{width:20px;height:20px;accent-color:var(--gold)}
.mt.dis{opacity:.4}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fafafa;position:relative}
.ph img{width:100%;height:120px;object-fit:cover;display:block}
.ph input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:12px;padding:6px 8px}
.ph .x{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:14px}
.ph-add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;height:150px;border:1px dashed var(--green);border-radius:10px;color:var(--green);font-weight:700;cursor:pointer;background:#f4f8f6;font-size:13px}
.ph-add span{font-size:30px;line-height:1}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:9px 12px;z-index:9}
.bar .in{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.prog{font-size:13px;color:var(--gray)}
.prog b{font-size:18px;color:var(--p)}
.chips{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.chip{padding:3px 9px;border-radius:20px;font-weight:700}
.chip.n{background:#f6e3e0;color:var(--brick)}.chip.m{background:#f7efd2;color:#7a5a00}
.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.btn.p{background:var(--green);color:#fff}.btn.s{background:#fff;color:var(--green);border:1px solid var(--green)}.btn.d{background:#fff;color:var(--brick);border:1px solid var(--brick)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tip{display:none;background:#eaf3ef;border:1px solid var(--g1);color:#1F3D31;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px;line-height:1.7}
.saved{font-size:11px;color:var(--gray)}
#print{display:none}
@media print{
  body{background:#fff}
  .app,.bar,#ptip{display:none!important}
  #print{display:block}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  @page{size:A4 portrait;margin:9mm 9mm 10mm 9mm}
}
.pg{font-family:Cairo,sans-serif;color:#111;direction:rtl;width:192mm;margin:0 auto}
.phdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:2mm}
.phdr img.rga{height:11mm}.phdr img.con{height:11mm}
table.t{width:100%;border-collapse:collapse;font-size:7.6pt;line-height:1.3}
table.t tr{break-inside:avoid;page-break-inside:avoid}
table.t td,table.t th{border:.6pt solid #555;padding:1.2pt 3pt;text-align:center;vertical-align:middle}
table.t .ttl{background:var(--beige);font-size:12pt;font-weight:700;padding:3pt}
table.t th{background:#F2F2F2;font-weight:700}
table.t td.v{font-weight:700;font-size:8.2pt}
table.t tr.sec td{background:var(--beige);font-weight:700;font-size:7.8pt;padding:.8pt}
table.t td.nm{text-align:right;font-weight:700;white-space:nowrap}
table.t td.nm img{height:5.4mm;width:6.5mm;object-fit:contain;vertical-align:middle;margin-left:2pt}
table.t td.cr{text-align:right;font-size:7pt;color:#222}
table.t td.mk{font-size:10pt;font-weight:700;width:9mm}
table.t td.mk.y{color:#2e6b52}table.t td.mk.n{color:#A8483D;background:#f7e6e3}table.t td.mk.na{color:#555}table.t td.mk.m{color:#8a6a00;background:#fbf3d6}
table.t td.nt{text-align:right;font-size:7pt;width:38mm}
.sum{font-size:8pt;margin:1.5mm 0;display:flex;gap:6mm;justify-content:center}
.sign{display:flex;justify-content:space-between;margin-top:4mm;font-size:9pt}
.sign div{width:46%}
.sign .l{font-weight:700;margin-bottom:1mm}
.sign .ln{border-bottom:.6pt solid #555;min-height:5mm;padding-top:1mm}
.phpage{break-before:page}
.phpage h3{font-size:11pt;background:var(--beige);border:.6pt solid #555;margin:0 0 3mm;padding:2pt 6pt;text-align:center}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.pgrid figure{margin:0;border:.6pt solid #999;break-inside:avoid;page-break-inside:avoid}
.pgrid img{width:100%;height:68mm;object-fit:contain;background:#f3f3f3;display:block}
.pgrid figcaption{font-size:8pt;padding:1.5pt 4pt;border-top:.6pt solid #999;min-height:5mm}
.pfoot{font-size:7pt;color:#555;text-align:center;margin-top:2mm}
</style>
</head>

  ['زي رسمي','نظيف – بحالة جيدة – مطابق للوائح']]},
 {t:'السلامة العامة للمعدة',items:[
  ['طفاية الحريق','موجودة – مثبّتة – تاريخ الصلاحية ساري'],
  ['لوحات تحذيرية بالخلف','واضحة – مثبتة – مطابقة للمعايير'],
  ['العواكس الجانبية','مركبة – مطابقة للمواصفات – غير تالفة'],
  ['إنذار الرجوع للخلف','يعمل بوضوح عند الرجوع'],
  ['Beacon Light','تعمل – ظاهرة للآخرين']]},
 {t:'النواحي الميكانيكية والكهربائية',items:[
  ['الأنوار الأمامية قريبة المدى','تعمل بكفاءة'],
  ['الأنوار الأمامية بعيدة المدى','تعمل بكفاءة'],
  ['الأنوار الخلفية','تعمل بكفاءة – ضباب (إن وجد)'],
  ['الفرامل','تعمل بكفاءة – لا يوجد أصوات احتكاك'],
  ['الإشارات الضوئية','يمين – يسار – إشارة الخطر تعمل (فلشر)'],
  ['البوري','يعمل بوضوح'],
  ['التسريبات','لا يوجد تسريب زيت – هيدروليك – وقود – ماء'],
  ['العدادات','ضغط الزيت – الحرارة – عداد السرعة يعمل'],
  ['الإطارات','عمق النقشة – ضغط الإطارات – لا يوجد تشققات'],
  ['التوجيه','لا يوجد احتكاك – لا يوجد تأخير بالتوجيه – محاذاة العجلات'],
  ['ماسحات الزجاج','تعمل بكفاءة – مستوى الماء كافٍ']]},
 {t:'المتطلبات الإدارية',items:[
  ['رخصة/TUV السائق','سارية – مطابقة للمعدة'],
  ['تأمين المعدة','ساري المفعول'],
  ['سجل الفحص اليومي','موجود داخل المعدة – محدث'],
  ['الكابينة','نظيفة – خالية من العوائق – لا يوجد ستائر تحجب الرؤية – معدات الطوارئ موجودة']]}
];
const ALL=[];SECS.forEach(s=>s.items.forEach(it=>ALL.push(it)));
const ST={y:'موجود',n:'غير موجود',na:'لا ينطبق'};
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const KEY='eq_daily_v1';
let S={hdr:{},it:{},names:{},ph:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- IndexedDB for photos ---------- */
let DB=null;
function idb(){return new Promise((res,rej)=>{if(DB)return res(DB);try{const r=indexedDB.open('eq_daily_photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>{DB=r.result;res(DB)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function pPut(id,v){try{const d=await idb();d.transaction('p','readwrite').objectStore('p').put(v,id)}catch(e){}}
async function pDel(id){try{const d=await idb();d.transaction('p','readwrite').objectStore('p').delete(id)}catch(e){}}
async function pGet(id){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('p').objectStore('p').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function pClear(){try{const d=await idb();d.transaction('p','readwrite').objectStore('p').clear()}catch(e){}}
const PH={};
/* ---------- save/load ---------- */
let tmr=null;
function save(){clearTimeout(tmr);tmr=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));$('saved').textContent='محفوظ تلقائياً '+new Date().toLocaleTimeString('ar-SA-u-nu-latn',{hour:'2-digit',minute:'2-digit'})}catch(e){$('saved').textContent='تعذّر الحفظ التلقائي'}},300)}
async function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v)S=Object.assign(S,v)}catch(e){}
  if(!S.hdr.date){const d=new Date();S.hdr.date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  try{const n=JSON.parse(localStorage.getItem(KEY+'_names')||'null');if(n){S.names.hse=S.names.hse||n.hse;S.names.insp=S.names.insp||n.insp}}catch(e){}
  for(const p of S.ph){const v=await pGet(p.id);if(v)PH[p.id]=v}
  S.ph=S.ph.filter(p=>PH[p.id]);
}
function dayOf(ds){if(!ds)return'';const [y,m,d]=ds.split('-').map(Number);return DAYS[new Date(y,m-1,d).getDay()]}
function fmtDate(ds){if(!ds)return'';const [y,m,d]=ds.split('-');return d+'/'+m+'/'+y}
/* ---------- render ---------- */
function render(){
  ['date','eqNo','eqType','driver','serial'].forEach(k=>{const el=$(k);el.value=S.hdr[k]||'';el.oninput=()=>{S.hdr[k]=el.value.trim()?el.value:'';if(k==='date')$('day').value=dayOf(el.value);save();upd()}});
  $('day').value=dayOf(S.hdr.date);
  ['hse','insp'].forEach(k=>{const el=$(k);el.value=S.names[k]||'';el.oninput=()=>{S.names[k]=el.value;save();try{localStorage.setItem(KEY+'_names',JSON.stringify(S.names))}catch(e){}}});
  let h='',i=0;
  SECS.forEach(s=>{h+='<div class="card"><h2>'+s.t+'</h2>';s.items.forEach(it=>{h+=itemHtml(i++)});h+='</div>'});
  $('items').innerHTML=h;
  renderPhotos();upd();
}
function itemHtml(i){const it=ALL[i],v=S.it[i]||{};
  return '<div class="item" id="it'+i+'"><div class="ih"><img src="'+IC['i'+String(i).padStart(2,'0')]+'" alt=""><div><div class="t">'+(i+1)+'. '+esc(it[0])+'</div><div class="c">'+esc(it[1])+'</div></div></div>'+
  '<div class="seg">'+['y','n','na'].map(k=>'<button class="'+k+(v.st===k?' on':'')+'" onclick="setSt('+i+',\''+k+'\')">'+(k==='y'?'✔ ':k==='n'?'✖ ':'')+ST[k]+'</button>').join('')+'</div>'+
  '<label class="mt'+(v.st==='na'?' dis':'')+'"><input type="checkbox" '+(v.m?'checked':'')+(v.st==='na'?' disabled':'')+' onchange="setM('+i+',this.checked)"> ⚠ يحتاج صيانة / استبدال</label>'+
  '<textarea rows="1" placeholder="ملاحظات" oninput="setN('+i+',this.value)">'+esc(v.note||'')+'</textarea></div>'}
function refreshItem(i){const el=$('it'+i);const tmp=document.createElement('div');tmp.innerHTML=itemHtml(i);el.replaceWith(tmp.firstChild);upd()}
function setSt(i,k){S.it[i]=S.it[i]||{};S.it[i].st=(S.it[i].st===k?undefined:k);if(S.it[i].st==='na')S.it[i].m=false;save();refreshItem(i)}
function setM(i,c){S.it[i]=S.it[i]||{};S.it[i].m=c;save();upd()}
function setN(i,t){S.it[i]=S.it[i]||{};S.it[i].note=t;save()}
function allYes(){let c=0;for(let i=0;i<ALL.length;i++){S.it[i]=S.it[i]||{};if(!S.it[i].st){S.it[i].st='y';c++}}save();render();if(!c)alert('كل البنود معبأة مسبقاً.')}
function counts(){let a=0,y=0,n=0,na=0,m=0;for(let i=0;i<ALL.length;i++){const v=S.it[i]||{};if(v.st){a++;v.st==='y'?y++:v.st==='n'?n++:na++}if(v.m)m++}return{a,y,n,na,m}}
function upd(){const c=counts();$('cnt').textContent=c.a;
  $('chips').innerHTML=(c.n?'<span class="chip n">غير موجود: '+c.n+'</span>':'')+(c.m?'<span class="chip m">يحتاج صيانة: '+c.m+'</span>':'');
  for(let i=0;i<ALL.length;i++){const el=$('it'+i);if(!el)continue;const v=S.it[i]||{};el.classList.toggle('done',!!v.st&&v.st!=='n'&&!v.m);el.classList.toggle('bad',v.st==='n'||!!v.m);el.classList.remove('miss')}}
/* ---------- photos ---------- */
function renderPhotos(){let h=S.ph.map((p,i)=>'<div class="ph"><img src="'+PH[p.id]+'" alt=""><button class="x" onclick="delPh('+i+')">✕</button><input type="text" placeholder="وصف الصورة (اختياري)" value="'+esc(p.cap||'')+'" oninput="capPh('+i+',this.value)"></div>').join('');
  h+='<label class="ph-add" for="phin"><span>＋</span>إضافة صور</label>';$('photos').innerHTML=h;$('phc').textContent=S.ph.length+' صورة'}
function shrink(file){return new Promise((res)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const M=1400;let w=img.width,h=img.height;if(w>M||h>M){const r=Math.min(M/w,M/h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.72))};img.onerror=()=>res(null);img.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}
$('phin').onchange=async e=>{const fs=[...e.target.files];for(const f of fs){const d=await shrink(f);if(!d)continue;const id='p'+Date.now()+Math.random().toString(36).slice(2,7);PH[id]=d;await pPut(id,d);S.ph.push({id,cap:''})}e.target.value='';save();renderPhotos()};
function delPh(i){if(!confirm('حذف الصورة؟'))return;const p=S.ph.splice(i,1)[0];delete PH[p.id];pDel(p.id);save();renderPhotos()}
function capPh(i,v){S.ph[i].cap=v;save()}
/* ---------- validate & print ---------- */
function validate(){const miss=[];
  if(!S.hdr.date)miss.push('التاريخ');if(!(S.hdr.eqNo||'').trim())miss.push('رقم المعدة');if(!(S.hdr.eqType||'').trim())miss.push('نوع المعدة');if(!(S.hdr.driver||'').trim())miss.push('اسم السائق');
  const un=[];for(let i=0;i<ALL.length;i++){if(!(S.it[i]||{}).st){un.push(i);const el=$('it'+i);el&&el.classList.add('miss')}}
  if(un.length)miss.push('بنود غير معبأة: '+un.map(i=>i+1).join('، '));
  if(!(S.names.hse||'').trim())miss.push('اسم مهندس السلامة والصحة المهنية');if(!(S.names.insp||'').trim())miss.push('اسم المراقب / المفتش');
  if(miss.length){alert('أكمل قبل التصدير:\n• '+miss.join('\n• '));if(un.length){const el=$('it'+un[0]);el&&el.scrollIntoView({behavior:'smooth',block:'center'})}return false}return true}
function buildPrint(){const H=S.hdr,c=counts();
  let rows='',i=0;
  SECS.forEach(s=>{rows+='<tr class="sec"><td colspan="7">'+s.t+'</td></tr>';s.items.forEach(it=>{const v=S.it[i]||{};
    rows+='<tr><td class="nm"><img src="'+IC['i'+String(i).padStart(2,'0')]+'">'+esc(it[0])+'</td><td class="cr">'+esc(it[1])+'</td>'+
    '<td class="mk '+(v.st==='y'?'y':'')+'">'+(v.st==='y'?'✔':'')+'</td><td class="mk '+(v.st==='n'?'n':'')+'">'+(v.st==='n'?'✖':'')+'</td><td class="mk '+(v.st==='na'?'na':'')+'">'+(v.st==='na'?'N/A':'')+'</td><td class="mk '+(v.m?'m':'')+'">'+(v.m?'⚠':'')+'</td><td class="nt">'+esc(v.note||'')+'</td></tr>';i++})});
  let h='<div class="pg"><div class="phdr"><img class="rga" src="'+LOGO_RGA+'"><img class="con" src="'+LOGO_CON+'"></div>'+
  '<table class="t"><tr><td class="ttl" colspan="7">سجل الفحص اليومي للمعدات والآليات</td></tr>'+
  '<tr><th>التاريخ</th><th>اليوم</th><th colspan="2">اسم السائق</th><th colspan="2">نوع المعدة</th><th>رقم المعدة'+(H.serial?' / الرقم التسلسلي':'')+'</th></tr>'+
  '<tr><td class="v">'+fmtDate(H.date)+'</td><td class="v">'+dayOf(H.date)+'</td><td class="v" colspan="2">'+esc(H.driver)+'</td><td class="v" colspan="2">'+esc(H.eqType)+'</td><td class="v">'+esc(H.eqNo)+(H.serial?' / '+esc(H.serial):'')+'</td></tr>'+
  '<tr><th style="width:38mm">البند</th><th>المعيار / الوصف</th><th>✔<br>موجود</th><th>✖<br>غير موجود</th><th>N/A<br>لا ينطبق</th><th>⚠<br>صيانة / استبدال</th><th>ملاحظات</th></tr>'+rows+'</table>'+
  '<div class="sum"><span>موجود: <b>'+c.y+'</b></span><span>غير موجود: <b>'+c.n+'</b></span><span>لا ينطبق: <b>'+c.na+'</b></span><span>يحتاج صيانة / استبدال: <b>'+c.m+'</b></span><span>عدد الصور: <b>'+S.ph.length+'</b></span></div>'+
  '<div class="sign"><div><div class="l">مراقب / مفتش السلامة</div><div class="ln">الاسم / '+esc(S.names.insp)+'</div><div class="ln">التوقيع /</div></div><div><div class="l">مهندس السلامة والصحة المهنية</div><div class="ln">الاسم / '+esc(S.names.hse)+'</div><div class="ln">التوقيع /</div></div></div></div>';
  if(S.ph.length){for(let k=0;k<S.ph.length;k+=6){h+='<div class="pg phpage"><h3>صور الفحص — المعدة '+esc(H.eqNo)+' — '+fmtDate(H.date)+(S.ph.length>6?' ('+(k/6+1)+'/'+Math.ceil(S.ph.length/6)+')':'')+'</h3><div class="pgrid">'+
    S.ph.slice(k,k+6).map((p,j)=>'<figure><img src="'+PH[p.id]+'"><figcaption>'+(k+j+1)+'. '+esc(p.cap||'')+'</figcaption></figure>').join('')+'</div></div>'}}
  $('print').innerHTML=h;
  document.title='فحص-معدة-'+(H.eqNo||'').replace(/[\\/:*?"<>|\s]+/g,'-')+'-'+(H.date||'');
}
function doPrint(){if(!validate())return;buildPrint();$('ptip').style.display='block';window.scrollTo(0,0);
  const imgs=[...$('print').querySelectorAll('img')];Promise.all(imgs.map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r}))).then(()=>setTimeout(()=>window.print(),400))}
window.onafterprint=()=>{document.title='سجل الفحص اليومي للمعدات والآليات';setTimeout(()=>{$('ptip').style.display='none'},4000)};
async function resetAll(){if(!confirm('بدء تقرير جديد؟ سيتم مسح بيانات المعدة والبنود والصور الحالية (تبقى أسماء المهندس والمفتش).'))return;
  const names=S.names;S={hdr:{},it:{},names,ph:[]};for(const k in PH)delete PH[k];await pClear();try{localStorage.removeItem(KEY)}catch(e){}await load();render();window.scrollTo(0,0)}
load().then(render);
</script>
</body>
</html>
