<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقييم تحويلة نهارية — نموذج تجريبي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{color-scheme:light;--p:#407189;--brick:#A8483D;--taupe:#7B6756;--gray:#636569;--green:#3E7761;--gold:#C6A230;--g1:#9FC3B3;--line:#d9dde1;--bg:#F2F4F5}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:#1f2328}
.app{max-width:860px;margin:0 auto;padding:12px 12px 120px}
.top{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;color:var(--green)}
.top small{color:var(--gray)}
.tag{font-size:11px;background:#fff3d6;color:#7a5a00;border:1px solid #e9d59a;border-radius:8px;padding:2px 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;position:relative}
.card.item{border-right:4px solid var(--green)}
.card h2{font-size:18px;color:var(--green);margin:0 0 10px;border-bottom:2px solid var(--green);padding-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.card h2 span.sc{font-size:15px;color:var(--gray)}
.card h3{font-size:15px;color:var(--green);margin:0 0 8px;border-bottom:1px solid var(--green);padding-bottom:5px}
.grp{font-size:13px;color:var(--gray);margin:14px 4px 6px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
label.f{display:block;font-size:12px;color:var(--gray);margin-bottom:3px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:14px;background:#fff}
textarea{resize:vertical;min-height:64px}
.opt{display:flex;flex-direction:column;gap:8px}
.opt button{text-align:right;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;cursor:pointer;line-height:1.5}
.opt button b{margin-left:6px}
.opt button.g0.on{background:var(--green);color:#fff;border-color:var(--green)}
.opt button.g1.on{background:var(--g1);color:#1F3D31;border-color:var(--g1)}
.opt button.g2.on{background:var(--gold);color:#3B2F05;border-color:var(--gold)}
.opt button.g3.on{background:var(--brick);color:#fff;border-color:var(--brick)}
.note{margin-top:10px}
.note label{font-size:12px;color:var(--brick);font-weight:600}
.cnt{font-size:11px;color:var(--gray);text-align:left}
.locked{opacity:.55;pointer-events:none}
.lockmsg{font-size:12px;color:var(--taupe);background:#f8f3e0;border-radius:8px;padding:6px 10px;margin-bottom:8px}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ph{width:120px;height:90px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.ph-add{width:120px;height:90px;border:1px dashed var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--green);font-size:28px;cursor:pointer;background:#f4f8f6}
.ph-wrap{position:relative}
.ph-x{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px}
.ded label{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.ded label:last-child{border:0}
.ded b{color:var(--brick);margin-left:8px}
.ded input{width:20px;height:20px;accent-color:var(--brick)}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;z-index:9}
.bar .tot{font-size:22px;font-weight:700;color:var(--p)}
.bar .tot small{font-size:12px;color:var(--gray);font-weight:400}
.badge{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700;color:#fff;background:#636569}
.badge.ok{background:var(--green)}.badge.bad{background:var(--brick)}
.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.btn.p{background:var(--green);color:#fff}.btn.s{background:#fff;color:var(--green);border:1px solid var(--green)}.btn.d{background:#fff;color:var(--brick);border:1px solid var(--brick)}
.warn{background:#fdf0ee;color:var(--brick);border:1px solid #efc7c1;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px;display:none}
#print{display:none}
@media print{
  body{background:#fff}
  .app,.bar{display:none!important}
  #print{display:block}
  @page{size:A4;margin:12mm 14mm 14mm 14mm}
}
.pg{font-family:Cairo,sans-serif;color:#111;direction:rtl;width:182mm;margin:0 auto;page-break-after:always}
.pg:last-child{page-break-after:auto}
.hdr{display:flex;justify-content:space-between;align-items:center;height:18mm;margin-bottom:2mm}
.hdr img{height:16mm}
.bars{height:0;border-top:2.2mm solid #2E7D32;border-bottom:1.2mm solid #1F3864;margin-bottom:5mm}
table.t{width:100%;border-collapse:collapse;font-size:8.5pt}
table.t td,table.t th{border:0.6pt solid #808080;padding:2px 4px;text-align:center;vertical-align:middle}
table.t th{background:#D9D9D9;font-weight:700}
table.t td.k{background:#F2F2F2;font-weight:700;text-align:right;width:38%}
table.t td.g{background:#F2F2F2;font-weight:700}
.mx td.d{font-size:7.5pt;line-height:1.35;text-align:center}
.mx td.n{font-weight:700;font-size:8pt;width:15%}
.mx td.s{font-weight:700;font-size:9pt;width:8%}
.mx th.h0{border-top:3pt solid #3E7761}.mx th.h1{border-top:3pt solid #9FC3B3}.mx th.h2{border-top:3pt solid #C6A230}.mx th.h3{border-top:3pt solid #A8483D}
.c0{background:#3E7761!important;color:#fff}.c1{background:#9FC3B3!important;color:#1F3D31}.c2{background:#C6A230!important;color:#3B2F05}.c3{background:#A8483D!important;color:#fff}
.res{color:#fff;font-weight:700;font-size:11pt}
.notes{font-size:9pt;margin:6px 0 2px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin-top:3mm}
.pgrid img{width:86mm;height:65mm;object-fit:cover;border:0.5pt solid #999}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><h1>تقييم تحويلة نهارية قصيرة / متوسطة الأجل</h1><small>نموذج تجريبي — وفق خطاب 83394/2 والنماذج القياسية التسعة</small></div><span class="tag">تجربة — غير معتمد</span></div>
  <div class="warn" id="warn"></div>
  <div class="card"><h2>بيانات التحويلة</h2><div class="grid" id="hdrfields"></div></div>
  <div id="zones"></div>
  <div class="card"><h2>حسم الملاحظات العامة <span class="sc" id="dedsc">0 / −20</span></h2><div class="ded" id="deds"></div>
    <div class="note"><label>أبرز الملاحظات على الخصومات</label><textarea id="dednote" maxlength="150" rows="2" placeholder="اختياري"></textarea></div>
    <div class="grp">صور الخصومات</div><div class="photos" id="ph_d"></div>
  </div>
  <div class="card"><h2>المقيّم</h2><div class="grid"><div><label class="f">اسم مهندس الفحص</label><input type="text" id="evaluator" placeholder="الاسم"></div><div><label class="f">الرقم الوظيفي</label><input type="text" id="evno" placeholder="APP-xxxxx"></div></div></div>
</div>
<div class="bar">
  <div><div class="tot"><span id="total">0</span> <small>/ 100</small></div><span class="badge" id="badge">غير مكتمل</span></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
    <button class="btn d" onclick="resetAll()">مسح</button>
    <button class="btn s" onclick="doPrint()">طباعة / حفظ PDF</button>
    <button class="btn p" onclick="downloadPdf()">تنزيل PDF</button>
  </div>
</div>

function addPhotos(zi,files){[...files].forEach(f=>{const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const R=8.6/6.5;let w=img.width,h=img.height,sx=0,sy=0,sw=w,sh=h;if(w/h>R){sw=h*R;sx=(w-sw)/2}else{sh=w/R;sy=(h-sh)/2}c.width=1200;c.height=Math.round(1200/R);c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);(S.photos[zi]=S.photos[zi]||[]).push(c.toDataURL('image/jpeg',.8));renderPhotos(zi);save();};img.src=e.target.result};r.readAsDataURL(f)});}
function zoneScore(zi){const z=Z[zi];const m=model();if(z.lock==='nolane'&&m&&!m.lane)return{s:z.max,done:true};let s=0,done=true;
  z.items.forEach(it=>{if(it.g)return;if(it.tma){const req=m?m.tma:1;if(S.tmaPresent===null||S.tmaPresent===undefined){done=false;return}let v=3*S.tmaPresent/req;if(S.tmaHalf)v/=2;s+=v;return}
    if(it.only&&roadType()&&roadType()!==it.only){s+=it.v[0];return}
    const ci=S.sel[it.k];if(ci===undefined){done=false;return}s+=it.v[ci];});return{s:+s.toFixed(2),done};}

  let d=0;D.forEach((x,i)=>{if(S.ded[i])d+=x[1]});d=Math.min(d,20);document.getElementById('dedsc').textContent=`−${d} / −20`;

      if(it.tma){const req=m.tma;let v=S.tmaPresent===null?0:3*S.tmaPresent/req;if(S.tmaHalf)v/=2;v=+v.toFixed(2);const cls=v>=3?0:(v>=1.5?1:(v>0?2:3));
        h+=`<tr><td class="n">${it.n}<br>(3 نقاط — تُوزَّع على ${req} شاحنة مطلوبة)</td><td class="d" colspan="4">المتوفر: ${S.tmaPresent} من ${req}${S.tmaHalf?' — ناقصة التجهيز (نصف الدرجة)':' — بأضواء تحذيرية وماص صدمات'}</td><td class="s c${cls}">${v}</td></tr>`;return}
      const ci=na?0:S.sel[it.k];const g=gradeIdx(n,ci);const spans=n===4?[1,1,1,1]:(n===3?[1,2,1]:[2,2]);
      h+=`<tr><td class="n" rowspan="2">${it.n}<br>(${it.v[0]} ${it.v[0]===1?'نقطة':'نقاط'})${na&&!locked?'<br><small>غير منطبق — درجة كاملة</small>':''}</td>${it.d.map((tx,i)=>`<td class="d" colspan="${spans[i]}">${tx}</td>`).join('')}<td class="s c${g}" rowspan="2">${it.v[ci]}</td></tr><tr>${it.v.map((v,i)=>`<td colspan="${spans[i]}" class="${i===ci?'c'+gradeIdx(n,i):''}" style="font-weight:700">${v}</td>`).join('')}</tr>`;});
    h+=`<tr><td colspan="5" class="g">مجموع نقاط ${z.t}</td><td class="g">${zs}</td></tr></table>`;
    const nts=z.items.filter(it=>!it.g&&S.notes[it.k]).map(it=>S.notes[it.k]).join('، ');h+=`<div class="notes"><b>أبرز الملاحظات:</b> ${nts||'لا توجد ملاحظات'}</div>`;
    const ph=S.photos[zi]||[];if(ph.length)h+=`<div class="notes"><b>الصور</b></div><div class="pgrid">${ph.map(p=>`<img src="${p}">`).join('')}</div>`;h+=`</div>`;});
  h+=`<div class="pg">${pageHead()}<table class="t"><tr><th colspan="3">حسم الملاحظات العامة (−20) — يتم خصم النقاط عند عدم الالتزام</th></tr><tr><th style="text-align:right">ملاحظات عامة على التحويلة</th><th>الدرجة</th><th>الخصم</th></tr>${D.map((x,i)=>`<tr><td style="text-align:right">${x[0]}</td><td>−${x[1]}</td><td class="${S.ded[i]?'c3':''}" style="font-weight:700">${S.ded[i]?'−'+x[1]:0}</td></tr>`).join('')}<tr><td colspan="2" class="g">مجموع خصم الملاحظات العامة (الحد الأقصى −20)</td><td class="g">−${r.d}</td></tr></table><div class="notes"><b>أبرز الملاحظات:</b> ${S.dednote||'لا توجد ملاحظات'}</div>`;
  const pd=S.photos['d']||[];if(pd.length)h+=`<div class="pgrid">${pd.map(p=>`<img src="${p}">`).join('')}</div>`;h+=`</div>`;
  document.getElementById('print').innerHTML=h;return true;}
function doPrint(){if(buildPrint())setTimeout(()=>window.print(),300);}
function downloadPdf(){if(!buildPrint())return;const el=document.getElementById('print');el.style.display='block';
  html2pdf().set({margin:[12,14,14,14],filename:'RGA-DDT-'+((S.hdr.region||'').split(' ')[0]||'XX')+'-'+(S.hdr.date||'draft')+'.pdf',image:{type:'jpeg',quality:.85},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(el).save().then(()=>{el.style.display=''});}
load();render();
</script>
