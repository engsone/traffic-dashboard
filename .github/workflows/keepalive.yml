name: keepalive
# نبضة يومية تمنع إيقاف مشروع Supabase المجاني (hse-tracker) بسبب الخمول (كل ٣ أيام لم تكفِ: توقف 11–13/11/2026).
# المفتاح في Settings → Secrets and variables → Actions → SUPABASE_KEY
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - name: ping supabase
        run: |
          curl -sS --fail-with-body -X POST "https://urfqalbzphmhkofcgbuo.supabase.co/rest/v1/rpc/jamiya_ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
